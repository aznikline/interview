name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  docs-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build index
        run: python scripts/build_index.py

      - name: Sync sources
        run: python scripts/sync_sources.py

      - name: Generate dashboard
        run: python scripts/generate_progress.py

      - name: Lint docs
        run: python scripts/lint_docs.py

      - name: Run tests
        run: pytest

